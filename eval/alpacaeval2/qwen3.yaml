# Historical dpo-eval adapter schema; read ../../README.md#evaluation before use.
precision: bf16
alpacaeval:
  backend: vllm
  simpo_compat: false
  use_custom_chat_template: true
  prompt_template: eval/alpacaeval2/qwen3-prompt.txt
  dataset_name: tatsu-lab/alpaca_eval
  dataset_config: alpaca_eval
  dataset_split: eval
  dataset_trust_remote_code: true
  annotators_config: weighted_alpaca_eval_gpt4_turbo_new
  evaluation_mode: outputs
  generation:
    seed: 42
    batch_size: 128
    do_sample: true
    max_new_tokens: 4096
    stop_token_ids:
    - 151645
    temperature: 0.9
    top_p: 1.0
  vllm:
    tensor_parallel_size: 1
    trust_remote_code: false
    gpu_memory_utilization: 0.9
  model_name_or_path: /path/to/checkpoint
  tokenizer_name_or_path: /path/to/checkpoint
  pretty_name: qwen3-lsc-dpo
  output_dir: outputs/alpacaeval2/qwen3-lsc-dpo
